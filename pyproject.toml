[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magli"
version = "2.1.0"
description = "magli (Modelo Aditivo Generalizado Lineal): Modern Pythonic Generalized Additive Models (GAMs) with Eilers-Marx (1996) and Wood (2011) backends"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "David Ávila Cortés"}
]
keywords = [
    "gam",
    "generalized-additive-models",
    "splines",
    "regression",
    "mgcv",
    "pygam",
    "reml",
    "p-splines",
    "shape-constraints",
    "interpretable-ml",
    "explainable-ai",
    "statistics",
    "machine-learning",
    "magli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
test = [
    "pytest>=7.0",
    "matplotlib>=3.5",
]
docs = [
    "sphinx>=9",
    "furo",
    "sphinx-copybutton",
]
notebooks = [
    "nbformat>=5.0",
    "nbclient>=0.7",
    "ipykernel>=6.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/dacts23/magli"
Repository = "https://github.com/dacts23/magli"
Documentation = "https://dacts23.github.io/magli/"

[tool.setuptools.packages.find]
where = ["src"]

